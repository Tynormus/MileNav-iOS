name: Build iOS Unsigned IPA (cloud Mac)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned .app
        run: |
          xcodebuild -project MileNav/MileNav.xcodeproj \
            -scheme MileNav -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/DerivedData build
      - name: Package unsigned IPA (Payload zip)
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -r MileNav-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MileNav-unsigned-ipa
          path: MileNav-unsigned.ipa
